<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>帮助 · 分贝监测仪</title><link rel="stylesheet" href="/style.css"></head><body><main><nav><a href="/">分贝监测仪</a><a href="/privacy.html">隐私说明</a></nav><h1>帮助与支持</h1><section class="card"><h2>读数代表什么？</h2><p>读数是手机麦克风的参考估算。设备、麦克风和环境会影响结果，不能代替专业声级计。</p><h2>麦克风不可用</h2><p>请在 iPhone 的“设置”中检查本应用的麦克风权限，并确认没有其他应用占用音频输入。</p><h2>记录与分享</h2><p>新版记录保存在本机。分享会将文件发送到你在系统分享表中选择的位置，请妥善保管。功能以已安装版本为准。</p><h2>联系开发者</h2><p><a href="https://www.jianshu.com/u/4c6440a67721">前往开发者主页</a>，反馈时请注明应用版本、iPhone 型号及问题步骤。</p></section><footer>© 2026 Li Chunhao</footer></main></body></html>
